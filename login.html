<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - SpendWise</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="navbar"><div class="container inner"><a class="brand" href="index.html"><span class="brand-badge">₹</span>SpendWise</a><div class="nav-actions"><a class="btn btn-light" href="index.html">Back Home</a></div></div></header>
<main class="auth-wrap">
  <section class="auth-card">
    <h1>Welcome back</h1><p class="sub">Login to manage your expenses.</p>
    <div id="loginMessage" class="message"></div>
    <form id="loginForm">
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Enter any password" required></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Login</button>
      <p class="help">Demo project: enter any valid email and any password.</p>
    </form>
  </section>
</main>
<script src="script.js"></script>
</body></html>
