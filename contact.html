<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact - SpendWise</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="navbar"><div class="container inner"><a class="brand" href="index.html"><span class="brand-badge">₹</span>SpendWise</a><button class="mobile-toggle">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="add-expense.html">Add Expense</a><a href="history.html">History</a><a href="status.html">Status</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><a class="btn btn-light" data-login-btn href="login.html">Login</a><button class="btn btn-danger" data-logout-btn>Logout</button></div></div></header>
<main class="container"><section class="page-header"><h1>Contact</h1><p>Send a message using this demo contact form.</p></section>
<section class="card" style="max-width:720px;margin:auto"><div id="contactMessage" class="message"></div><form id="contactForm"><div class="form-row"><div class="form-group"><label for="name">Name</label><input id="name" required></div><div class="form-group"><label for="contactEmail">Email</label><input id="contactEmail" type="email" required></div></div><div class="form-group"><label for="subject">Subject</label><input id="subject" required></div><div class="form-group"><label for="message">Message</label><textarea id="message" required></textarea></div><button class="btn btn-primary" type="submit">Send Message</button></form><div class="notice" style="margin-top:20px">This is a frontend-only demo. The message is not sent to a server.</div></section></main>
<footer class="footer"><div class="container inner"><span>© 2026 SpendWise</span><span>Frontend contact demo</span></div></footer><script src="script.js"></script></body></html>
