<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Expense - SpendWise</title><link rel="stylesheet" href="style.css"></head>
<body data-protected="true">
<header class="navbar"><div class="container inner"><a class="brand" href="index.html"><span class="brand-badge">₹</span>SpendWise</a><button class="mobile-toggle">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="add-expense.html">Add Expense</a><a href="history.html">History</a><a href="status.html">Status</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><button class="btn btn-danger" data-logout-btn>Logout</button></div></div></header>
<main class="container"><section class="page-header"><h1>Add Expense</h1><p>Record a new transaction. It will instantly appear in Dashboard, History and Status.</p></section>
<section class="card" style="max-width:760px;margin:auto"><div id="expenseMessage" class="message"></div><form id="expenseForm">
  <div class="form-row"><div class="form-group"><label for="title">Expense title *</label><input id="title" placeholder="e.g. Groceries" required></div><div class="form-group"><label for="amount">Amount (₹) *</label><input id="amount" type="number" step="0.01" min="0" placeholder="0.00" required></div></div>
  <div class="form-row"><div class="form-group"><label for="category">Category *</label><select id="category" required><option value="">Select category</option><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Entertainment</option><option>Education</option><option>Health</option><option>Other</option></select></div><div class="form-group"><label for="date">Date *</label><input id="date" type="date" required></div></div>
  <div class="form-group"><label for="note">Note</label><textarea id="note" placeholder="Optional note..."></textarea></div>
  <button class="btn btn-primary" type="submit">Save Expense</button>
</form></section></main>
<footer class="footer"><div class="container inner"><span>© 2026 SpendWise</span><span>Your data stays in your browser</span></div></footer><script src="script.js"></script></body></html>
